name: wiim-pc-bridge

services:
  owntone:
    image: docker.io/owntone/owntone@sha256:6a88589edc4dd9c438da62a18a25374d3e6e01457745f241a22baf88c43c9582
    container_name: wiim-pc-bridge-owntone
    network_mode: host
    environment:
      UID: "${BRIDGE_UID:-1000}"
      GID: "${BRIDGE_GID:-1000}"
    volumes:
      - ./runtime/owntone.conf:/etc/owntone/owntone.conf:ro
      - ./media:/srv/media
      - ./cache/owntone:/var/cache/owntone
    restart: unless-stopped

  shairport:
    image: docker.io/mikebrady/shairport-sync@sha256:06b05b07a0b6738c71b3be77da40db602197e2d9bc9c21c773af19624484b418
    container_name: wiim-pc-bridge-shairport
    network_mode: host
    environment:
      # The image startup script maps these to its mounted Pulse socket and
      # cookie. Pinning the sink avoids following a later desktop default.
      PULSE_SINK: "${DISPLAYPORT_SINK:?Set DISPLAYPORT_SINK in .env}"
    volumes:
      - ${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulseaudio.socket
      - ${PULSE_COOKIE_PATH:?Set PULSE_COOKIE_PATH in .env}:/tmp/pulseaudio.cookie:ro
    cap_add:
      - SYS_NICE
    command:
      - -v
      - -a
      - "${LOCAL_OUTPUT_NAME:-This PC DisplayPort}"
      # The local receiver uses NTP-timed classic AirPlay, which OwnTone can
      # synchronize with the Kitchen AirPlay 2 output.
      # Keep this as one argument: the image startup script uses this exact
      # shape to avoid launching its unused AirPlay 2 NQPTP helper.
      - --service-type=classic
      - -o
      - pulseaudio
    healthcheck:
      test: ["CMD-SHELL", "pidof shairport-sync >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  soloist:
    build:
      context: .
      dockerfile: Dockerfile.soloist
    image: wiim-pc-bridge/soloist:1.3.8.36-20260911
    container_name: wiim-pc-bridge-soloist
    network_mode: host
    user: "${BRIDGE_UID:-1000}:${BRIDGE_GID:-1000}"
    environment:
      XDG_RUNTIME_DIR: "${BRIDGE_RUNTIME_DIR:-/run/user/1000}"
      PULSE_SERVER: "unix:${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pulse/native"
      # Soloist currently uses the PipeWire Pulse compatibility server. This
      # variable is the authoritative route; --pipewire-device alone falls
      # back to the host default with this build.
      PULSE_SINK: "${BRIDGE_SINK:-wiim_bridge}"
      BRIDGE_SINK: "${BRIDGE_SINK:-wiim_bridge}"
      SOLOIST_DEVICE_NAME: "${BRIDGE_FRIENDLY_NAME:-PC + WiiM}"
    volumes:
      - ${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pipewire-0:${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pipewire-0
      - ${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pulse/native:${BRIDGE_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - ./media:/srv/media
      - ./cache/soloist/data:/var/lib/soloist
      - ./cache/soloist/cache:/var/cache/soloist
    secrets:
      - soloist_api_key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/soloist-child.pid &&
          kill -0 "$$(cat /tmp/soloist-child.pid)" &&
          test -s /tmp/parec.pid &&
          kill -0 "$$(cat /tmp/parec.pid)" &&
          soloist ctl status --ws 127.0.0.1:9090 >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      owntone:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

secrets:
  soloist_api_key:
    file: "${SOLOIST_KEY_FILE:?Set SOLOIST_KEY_FILE in .env}"
